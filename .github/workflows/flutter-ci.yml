name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/monthly-finance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Export resolved lockfile
        run: base64 -w0 pubspec.lock

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test
